# ============================================================
# NEXORA FOREX FRONTEND — Configuração de deploy no Render
# ============================================================
# Estratégia:
#   1. Build com Vite (vite build → gera /dist)
#   2. Serve com Express (server.js) — SPA routing funciona
#      correctamente porque o Express redireciona 404s para
#      index.html (em vez de retornar um erro real).
#
# Alternativa: usar "Static Site" no Render (gratuito), mas
# o SPA routing exige configurar redirect rules manualmente.
# Com Express, funciona out-of-the-box.
# ============================================================

services:
  - type: web
    name: nexora-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_DERIV_APP_ID
        sync: false
